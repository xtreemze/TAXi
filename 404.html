<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2d">
  <title>Wrong turn — TAXi</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#07101b; color:#f7f7f2; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 10%,#1d3854,#07101b 55%); }
    main { width:min(580px,100%); border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:clamp(28px,7vw,54px); background:linear-gradient(145deg,#13253a,#08111d); box-shadow:0 30px 100px rgba(0,0,0,.45); }
    .mark { display:inline-block; color:#111923; background:#ffd84d; padding:7px 11px 6px; font-size:22px; font-weight:1000; letter-spacing:-.06em; transform:skewX(-7deg); }
    p:first-of-type { margin-top:28px; color:#ffd84d; font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:6px 0 12px; font-size:clamp(40px,10vw,72px); line-height:.9; letter-spacing:-.06em; }
    p { color:#a9b4c2; line-height:1.6; }
    a { display:inline-block; margin-top:14px; padding:11px 15px; border-radius:10px; background:#ffd84d; color:#101722; font-weight:850; text-decoration:none; }
    a:focus-visible { outline:3px solid #55d9ff; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <span class="mark">TAXi</span>
    <p>404 · wrong turn</p>
    <h1>This street ends here.</h1>
    <p>The requested page does not exist. Dispatch is still open at the main game.</p>
    <a href="./">Return to TAXi</a>
  </main>
</body>
</html>
