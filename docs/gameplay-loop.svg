<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc">
  <title id="title">TAXi gameplay loop</title>
  <desc id="desc">Choose a fare, drive, deliver, manage resources, and close the shift.</desc>
  <rect width="1100" height="280" rx="22" fill="#07101b"/>
  <g font-family="system-ui,sans-serif">
    <text x="44" y="46" font-size="13" font-weight="800" letter-spacing="3" fill="#ffd84d">CORE LOOP</text>
    <text x="44" y="78" font-size="26" font-weight="850" fill="#f7f7f2">Every kilometer is a trade-off.</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="13">
    <g transform="translate(44 122)"><rect width="180" height="108" rx="14" fill="#102036" stroke="#2d4156"/><circle cx="28" cy="28" r="15" fill="#6ef1a7"/><text x="28" y="33" text-anchor="middle" font-weight="900" fill="#07101b">1</text><text x="54" y="32" font-weight="850" fill="#fff">Choose a fare</text><text x="18" y="63" fill="#a9b4c2">Compare distance, payout</text><text x="18" y="84" fill="#a9b4c2">and remaining shift time.</text></g>
    <g transform="translate(252 122)"><rect width="180" height="108" rx="14" fill="#102036" stroke="#2d4156"/><circle cx="28" cy="28" r="15" fill="#55d9ff"/><text x="28" y="33" text-anchor="middle" font-weight="900" fill="#07101b">2</text><text x="54" y="32" font-weight="850" fill="#fff">Drive</text><text x="18" y="63" fill="#a9b4c2">Distance advances only</text><text x="18" y="84" fill="#a9b4c2">while fuel is burning.</text></g>
    <g transform="translate(460 122)"><rect width="180" height="108" rx="14" fill="#102036" stroke="#2d4156"/><circle cx="28" cy="28" r="15" fill="#ffd84d"/><text x="28" y="33" text-anchor="middle" font-weight="900" fill="#07101b">3</text><text x="54" y="32" font-weight="850" fill="#fff">Deliver</text><text x="18" y="63" fill="#a9b4c2">Arrive on time for full</text><text x="18" y="84" fill="#a9b4c2">fare, tips and rating.</text></g>
    <g transform="translate(668 122)"><rect width="180" height="108" rx="14" fill="#102036" stroke="#2d4156"/><circle cx="28" cy="28" r="15" fill="#ffad57"/><text x="28" y="33" text-anchor="middle" font-weight="900" fill="#07101b">4</text><text x="54" y="32" font-weight="850" fill="#fff">Recover</text><text x="18" y="63" fill="#a9b4c2">Refuel, eat and rest —</text><text x="18" y="84" fill="#a9b4c2">but every stop costs time.</text></g>
    <g transform="translate(876 122)"><rect width="180" height="108" rx="14" fill="#102036" stroke="#2d4156"/><circle cx="28" cy="28" r="15" fill="#ff6b6b"/><text x="28" y="33" text-anchor="middle" font-weight="900" fill="#07101b">5</text><text x="54" y="32" font-weight="850" fill="#fff">Close shift</text><text x="18" y="63" fill="#a9b4c2">Pay nightly costs and</text><text x="18" y="84" fill="#a9b4c2">survive five days.</text></g>
  </g>
  <g stroke="#678198" stroke-width="3" fill="none" opacity=".8"><path d="M225 176h24"/><path d="M433 176h24"/><path d="M641 176h24"/><path d="M849 176h24"/></g>
</svg>
